<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'"><title>Blocking plan</title>
<style>

-width:420px;min-width:200px;padding:7px 28px 7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--glass);color:inherit;border-color:var(--glass-edge);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}.divider{width:3px}.toolbar .plain{border-color:transparent;background:transparent;box-shadow:none;font-size:12px;padding:7px 10px}.toolbar .plain:hover:not(:disabled){border-color:var(--glass-edge);background:var(--glass);box-shadow:var(--glass-shadow)}#cast{display:flex;gap:6px;overflow-x:auto;max-width:45%}.cast-person{display:flex;align-items:center;gap:6px;border-color:transparent;padding:5px 9px;font-size:12px}.cast-person.active{border-color:var(--accent);background:light-dark(#e5ede2,#415247)}.cast-person svg{width:16px;height:16px;fill:#7c9d89}.cast-person svg path{fill:#829e8c}#notice{font-size:12px;padding:9px 20px;color:light-dark(#586c58,#c0d3c4);background:transparent;flex-shrink:0}#notice:empty{display:none}#error{padding:8px 20px;font-size:12px;color:light-dark(#a04031,#f0b4a5);background:transparent;flex-shrink:0}#error:empty{display:none}#progress{font-size:11px;color:var(--muted)}main{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}section.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:20px 24px 12px}.paper{flex:1;min-height:0;touch-action:none;user-select:none;border-radius:5px;overflow:hidden}.paper svg{width:100%;height:100%;display:block}.paper .piece:hover{filter:brightness(1.06)}.paper .piece:active{cursor:grabbing!important}.hint{flex-shrink:0;font-size:11px;color:var(--muted);text-align:center;padding-top:10px}.empty{margin:auto;text-align:center;max-width:340px}.empty h2{font-size:20px;font-weight:500;margin:0 0 12px}.empty p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}.review{display:flex;align-items:center;gap:8px;padding:0 2px 10px;border:0;background:transparent;margin:0 0 4px}.review span{flex:1;font-size:12px}.review:empty,#review:empty{display:none}aside{display:none;position:absolute;right:32px;top:20px;width:236px;max-height:calc(100% - 60px);overflow:auto;pointer-events:auto;background:light-dark(#f6faf0c2,#293c31d9);border:1px solid var(--glass-edge);border-radius:24px;box-shadow:0 12px 36px #10271b19,inset 0 1px 0 #ffffff24;-webkit-backdrop-filter:blur(32px) saturate(170%);backdrop-filter:blur(32px) saturate(170%)}body.properties-open aside{display:block}main:has(#accept) aside{top:84px;max-height:calc(100% - 124px)}#inspector,#referencePanel{padding:16px;background:transparent;border:0;box-shadow:none;margin:0}#inspector:not([hidden])+#referencePanel:not([hidden]){border-top:1px solid var(--line)}#inspector:empty{display:none}.inspector-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.inspector-title strong{font-size:13px}.inspector-title button{padding:0 3px;font-size:20px;line-height:20px;border:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--muted)}label{display:block;font-size:11px;color:var(--muted);margin-bottom:13px}label input,label select,label textarea{margin-top:5px;width:100%;font:inherit;font-size:12px;background:light-dark(#ffffff3b,#ffffff07);color:light-dark(#293b32,#e4eae5);border:0;border-bottom:1px solid var(--line);border-radius:5px;padding:7px 6px}label input[type=range]{appearance:none;padding:0;height:20px;border:0;background:transparent;accent-color:#638f78;margin-top:12px}input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:light-dark(#54736240,#ffffff30)}input[type=range]::-webkit-slider-thumb{appearance:none;width:17px;height:17px;margin-top:-6.5px;border-radius:50%;background:#ffffffed;border:1px solid #ffffffa6;box-shadow:0 2px 5px #10271b28,inset 0 1px 0 white}output{float:right}.row{display:flex;gap:7px;align-items:center}.row>*{min-width:0;flex:1}.row button{font-size:11px;padding:7px 8px}.check{display:flex;align-items:center;gap:7px}.check input{width:auto;margin:0}details{border-top:1px solid var(--line);margin:13px 0;padding-top:10px}summary{font-size:11px;color:var(--muted);cursor:pointer;margin-bottom:10px}.small{color:var(--muted);font-size:11px;line-height:1.6}.direction-warning{font-size:11px;line-height:1.5;color:light-dark(#8b683e,#dcc098);border-top:1px solid var(--line);padding-top:10px}h2{font-size:12px;font-weight:600;margin:0 0 12px}.reference{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.reference img{width:100%;max-height:100px;object-fit:contain;background:#e9ede5}.reference strong{display:block;font-size:11px;margin:7px 0;overflow-wrap:anywhere}.reference textarea{font:inherit;font-size:11px;min-height:60px;resize:vertical}.reference button{font-size:11px}textarea{color:inherit}button[hidden],div[hidden],section[hidden]{display:none!important}@media(max-width:1100px){#cast,#undo,#redo{display:none}.toolbar select{max-width:340px;flex:1}.toolbar{gap:8px}}@media(max-width:950px){header{padding:0 14px}.toolbar{padding:0 14px;gap:6px}#cast{max-width:28%}.toolbar select{max-width:290px}section.stage{padding:14px 12px 12px}aside{right:20px}}@media(prefers-reduced-transparency:reduce){button,.toolbar select,aside{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}button.primary{background:#477564}}@media(prefers-contrast:more){button,.toolbar select,aside{border-color:currentColor}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
</style></head><body>
<header><div class="grow"><h1>Blocking plan</h1><div class="subtitle" id="heading">Scene</div></div><span id="progress" role="status"></span><button id="open">Open…</button><button id="save">Save</button><button id="exportPDF">PDF…</button><button id="exportPNG">PNG…</button><button id="done">Done</button></header>
<div class="toolbar"><select id="shot" aria-label="Shot overlay"></select><span class="divider"></span><div id="cast" aria-label="Characters in scene"></div><span class="grow"></span><button class="plain" id="placeActor">+ Person</button><button class="plain" id="placeTable">+ Table</button><button class="plain" id="referencesToggle">References</button><button class="plain" id="undo" title="Undo, Command-Z">Undo</button><button class="plain" id="redo" title="Redo, Shift-Command-Z">Redo</button><button class="primary" id="generate">Generate draft</button><button id="cancel" hidden>Cancel</button></div>
<div id="notice" role="status"></div><div id="error" role="alert"></div>
<main><section class="stage"><div id="review"></div><div id="canvas" class="paper"></div><div id="empty" class="empty"><h2>No blocking plan</h2><p>Generate people, camera positions and set pieces from this scene's shot list.</p><button class="primary" id="start">Generate draft</button></div><div id="hint" class="hint">Drag people and camera to move. Pull their small handles to turn.</div></section><aside><div id="inspector"></div><section id="referencePanel" hidden><h2>Location references</h2><p class="small">Floor plans and location photos guide placement. Geometry notes guide generation.</p><button id="reference">Add reference…</button><label class="check" style="margin-top:12px"><input type="checkbox" id="underlay" checked>Show on floor</label><div id="references"></div></section></aside></main>

name: Download release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Separate pushes never displace each other. Reruns of one run share a lock.
concurrency:
  group: download-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Validate
        run: |
          swift test --no-parallel
          bun test CLI/src scripts/release.test.ts
          bun CLI/contract.ts --check
          node .galicia/check.ts
          git diff --exit-code
      - name: Build app
        run: zsh scripts/build-app.sh release
      - name: Package and verify extracted download
        run: bun scripts/release.ts package
      - uses: actions/upload-artifact@v4
        with:
          name: download
          path: .build/download/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: download
          path: .build/download
      - name: Publish verified download
        run: bun scripts/release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
